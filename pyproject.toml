[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-quant"
version = "0.1.0"
description = "Sistema autônomo de sinais quantitativos (motor OHLC + transformação)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["quant", "trading", "ohlc", "historical-data"]
authors = [
    {name = "CognitiveQuant Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "statsmodels>=0.14.0",
    "pykalman>=0.9.5",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "arch>=5.3.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
f6-backtest = "motor.backtest.cli:main"

[project.urls]
Repository = "https://github.com/cognitivequant/cognitivequant"

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]